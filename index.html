<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <title>MatookeSmart — Farmer companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Keep the application frame fixed; long screens scroll inside the active module. */
    html, body { width: 100%; height: 100%; min-height: 0; margin: 0; overflow: hidden; }
    body { height: 100vh; height: 100dvh; overscroll-behavior: none; }
    .app-shell { width: 100%; height: 100vh; height: 100dvh; min-height: 0; overflow: hidden; }
    .sidebar { height: 100vh; height: 100dvh; box-sizing: border-box; overflow-y: auto; overscroll-behavior: contain; }
    .main-area { height: 100vh; height: 100dvh; min-height: 0; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; }
    .topbar, .app-footer { flex: 0 0 auto; }
    .page-content { flex: 1 1 auto; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; scrollbar-gutter: stable; }
    .modal-backdrop { overflow-y: auto; overscroll-behavior: contain; }
    .modal { max-height: calc(100dvh - 40px); overflow-y: auto; overscroll-behavior: contain; }
    @media (max-width: 700px) {
      .sidebar { position: fixed; z-index: 20; top: 0; bottom: 0; left: 0; height: 100vh; height: 100dvh; }
      .main-area { width: 100%; }
      .page-content { scrollbar-gutter: auto; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" aria-label="MatookeSmart home"><span class="brand-mark">M</span><span>matooke<span class="brand-light">smart</span><small>FARMER COMPANION</small></span></a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-view="market"><span class="nav-icon">↗</span>Market prices</button>
        <button class="nav-item" data-view="orders"><span class="nav-icon">▤</span>Early orders <span class="nav-count" id="order-count">0</span></button>
        <button class="nav-item" data-view="health"><span class="nav-icon">✿</span>Farm health</button>
        <button class="nav-item" data-view="hub"><span class="nav-icon">▧</span>Hub &amp; products</button>
        <button class="nav-item" data-view="opportunities"><span class="nav-icon">◎</span>Opportunities</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">✦</div><strong>Here to help</strong><p>Have a question about using MatookeSmart?</p><a href="mailto:hello@matookesmart.ug">Contact our team</a></div>
        <div class="profile"><div class="avatar">FA</div><div><strong>Farmer account</strong><small>Kasese District</small></div><button class="more-btn" aria-label="Profile options">···</button></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar"><button class="mobile-menu" id="menu-toggle" aria-label="Open menu">☰</button><div class="breadcrumb">Workspace <span>/</span> <strong id="crumb">Overview</strong></div><div class="topbar-date" id="today-label"></div></header>
      <section id="page-content" class="page-content" aria-live="polite"></section>
      <footer class="app-footer"><span>MatookeSmart Companion</span><span>Practical decisions for a better harvest <b>·</b> MVP prototype</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modal-backdrop" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button class="modal-close" id="modal-close" aria-label="Close dialog">×</button><div id="modal-content"></div></section></div>
  <script src="app.js"></script>
</body>
</html>
